# Per-country configuration (D1, §2). anchor_source is per country per tree.
# interest_anchor: level2 = COFOG 01.7 from the anchor's Level II table;
#                  d41    = GG gross D.41 payable from the same institution (D10).
# Set programmatically in Stage 0 once Level II coverage is measured; the
# values below are the D10 defaults (level2 where the anchor publishes L2).
#
# Since Stage R0 (REPLICATION_KICKOFF.md §11.1, D27; D-S15-001) this file is
# the single source of country routing: the country list itself
# (`config.COUNTRIES`), `name`, `currency` (the pandera schema reads both),
# `anchor_family` (which reader family serves every anchor cell —
# `config.family(iso3)`; an unconfigured family raises, never falls through
# to another country's path), `lines_absent` (D20 structural zeros, line ->
# reason; empty here), `period_basis` (D19: the anchor's basis and each
# tree's published basis; every tree CY here), `fy_to_cy_weights` (§7.10:
# [weight of FY t-1/t, weight of FY t/t+1] for this country's fiscal-year
# sources), `weo_perimeter_gap_expected` (§8.2 / V24 rule) and
# `perimeter_break` (§7.12: never extend a line below this year; DEU 1991,
# reunification). A fourth country is one more block here plus its readers.

countries:
  GBR:
    name: United Kingdom
    prose_name: the United Kingdom   # how prose joins the name (chart site)
    aliases: [United Kingdom, UK, GB]  # strings a chart title may use for the country
    currency: GBP
    anchor_family: ons
    anchors:
      expenditure: ONS_ESA_T11
      revenue: ONS_GG_RECEIPTS
      balance: ONS_GG_RECEIPTS
    gdp_source: ONS_GDP           # YBHA, £m CY (D-S0-006); ESA Table 2 has no GDP row
    interest_anchor: level2       # provisional — Stage 0 measures L2 coverage
    envelope_forecast: [OBR_EFO_LATEST, EC_AMECO]   # §15 Q12 default: OBR primary, AMECO cross-check
    period_basis_forecast: FY     # OBR/HMT Apr–Mar; convert per §7.10
    period_basis: {anchor: CY, trees: {expenditure: CY, expenditure_esa: CY, revenue: CY}}   # D19
    fy_to_cy_weights: [0.25, 0.75]    # §7.10: April–March sources
    lines_absent: {}                  # D20: no structural zeros
    weo_perimeter_gap_expected: true   # §8.2: small stable perimeter gap expected
    perimeter_break: null
    backward_legs: {}                 # no IMF GFS backward leg (ONS history reaches 1995 itself)
  FRA:
    name: France
    prose_name: France
    aliases: [France, FR]
    currency: EUR
    anchor_family: eurostat
    anchors:
      expenditure: EUROSTAT_GOV10A_EXP
      revenue: EUROSTAT_GOV10A_MAIN   # + EUROSTAT_GOV10A_TAXAG for tax detail
      balance: EUROSTAT_GOV10A_MAIN
    gdp_source: EUROSTAT_NAMA10_GDP
    interest_anchor: level2
    envelope_forecast: [EC_AMECO, EC_DSM]
    period_basis_forecast: CY
    period_basis: {anchor: CY, trees: {expenditure: CY, expenditure_esa: CY, revenue: CY}}   # D19
    fy_to_cy_weights: [0.25, 0.75]    # §7.10 default (no FY source in use)
    lines_absent: {}                  # D20: no structural zeros
    weo_perimeter_gap_expected: false
    perimeter_break: null
    backward_legs: {}                 # no IMF GFS backward leg (Eurostat history reaches 1995 itself)
  DEU:
    name: Germany
    prose_name: Germany
    aliases: [Germany, DE]
    currency: EUR
    anchor_family: eurostat
    anchors:
      expenditure: EUROSTAT_GOV10A_EXP
      revenue: EUROSTAT_GOV10A_MAIN
      balance: EUROSTAT_GOV10A_MAIN
    gdp_source: EUROSTAT_NAMA10_GDP
    interest_anchor: level2
    envelope_forecast: [EC_AMECO, EC_DSM]
    period_basis_forecast: CY
    period_basis: {anchor: CY, trees: {expenditure: CY, expenditure_esa: CY, revenue: CY}}   # D19
    fy_to_cy_weights: [0.25, 0.75]    # §7.10 default (no FY source in use)
    lines_absent: {}                  # D20: no structural zeros
    weo_perimeter_gap_expected: false
    perimeter_break: 1991             # reunification (§14): never extend below
    backward_legs:                    # generic IMF GFS legs (§6.1(2): the same national data
                                      # redistributed), enabled per country (R0 step 6, D-S15-006)
      gfs_cofog:                      # COFOG Level I 1991-94 and every Level II line with a gfs_indicator
        level1_note: "IMF GFS COFOG: redistribution of the same Destatis ESA data (boundary ratio ~1.0 at 1995); XDC levels"
        level2_note: "IMF GFS COFOG group {indicator}: redistribution of the same Destatis ESA data (coverage measured at the boundary); XDC levels"
      gfs_soo: null                   # ESA_EXP lines via the lines.yaml gfs_soo codes: available, not enabled
                                      # (AMECO reaches the 1991 break; enabling it would add a leg after AMECO)

# Tolerances (§15 Q4 defaults, as stated)
tolerances:
  imf_gfs_reconciliation_pct: 0.5      # V1
  sum_to_total_pct: 0.1                # V2, V22, V23
  level2_vs_d41_pct: 5.0               # V21
  oecd_rs_reconciliation_pct: 3.0      # V25
  base_bridge_pct_of_te: 1.0           # V24
  envelope_excess_pct: 1.0             # V15 (tol)
  v16_overlap_divergence: 0.02         # V16/D12 (D-S3-005): above this, the
                                       # long-term leg is NOT auto-joined —
                                       # flagged for committee review (OQ-7)
  v16_approved_joins:                  # OQ-7 RESOLVED by the committee
    # 2026-09-05 (D-S8-001): these above-threshold joins are approved and
    # applied. Grade rules still hold (a C-band leg stays maximum-only) and
    # V16 keeps WARNing on the divergence — approval changes application,
    # never visibility. Approving a future join = one row here + rebuild.
    - {iso3: FRA, line_code: GF01_7, incoming_source: EC_DSM}
    - {iso3: DEU, line_code: GF01_7, incoming_source: EC_DSM}
    - {iso3: GBR, line_code: R06, incoming_source: OBR_EFO_LATEST}
    # 2026-09-19 (D-S13-005): the committee approved the same DSM join for
    # the economic tree's interest line, so E05 and GF01_7 run to the same
    # 2036 horizon (identical source, concept and seam)
    - {iso3: FRA, line_code: E05, incoming_source: EC_DSM}
    - {iso3: DEU, line_code: E05, incoming_source: EC_DSM}
  perimeter_sigma_pct_te: 0.5          # V24 (D-S5-002): NLB-gap stability for a
                                       # country with weo_perimeter_gap_expected
                                       # (GBR) — sigma of gap/TE across overlap
                                       # years; D-S0-009 measured 0.36-0.42

variants: [strict, maximum_extension]
