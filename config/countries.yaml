# Per-country configuration (D1, §2). anchor_source is per country per tree.
# interest_anchor: level2 = COFOG 01.7 from the anchor's Level II table;
#                  d41    = GG gross D.41 payable from the same institution (D10).
# Set programmatically in Stage 0 once Level II coverage is measured; the
# values below are the D10 defaults (level2 where the anchor publishes L2).
#
# Since Stage R0 (REPLICATION_KICKOFF.md §11.1, D27; D-S15-001) this file is
# the single source of country routing: the country list itself
# (`config.COUNTRIES`), `name`, `currency` (the pandera schema reads both),
# `anchor_family` (which reader family serves every anchor cell —
# `config.family(iso3)`; an unconfigured family raises, never falls through
# to another country's path), `lines_absent` (D20 structural zeros, line ->
# reason; empty here), `period_basis` (D19: the anchor's basis and each
# tree's published basis; every tree CY here), `fy_to_cy_weights` (§7.10:
# [weight of FY t-1/t, weight of FY t/t+1] for this country's fiscal-year
# sources), `weo_perimeter_gap_expected` (§8.2 / V24 rule) and
# `perimeter_break` (§7.12: never extend a line below this year; DEU 1991,
# reunification). A fourth country is one more block here plus its readers.

countries:
  GBR:
    name: United Kingdom
    prose_name: the United Kingdom   # how prose joins the name (chart site)
    aliases: [United Kingdom, UK, GB]  # strings a chart title may use for the country
    currency: GBP
    anchor_family: ons
    anchors:
      expenditure: ONS_ESA_T11
      revenue: ONS_GG_RECEIPTS
      balance: ONS_GG_RECEIPTS
    gdp_source: ONS_GDP           # YBHA, £m CY (D-S0-006); ESA Table 2 has no GDP row
    interest_anchor: level2       # provisional — Stage 0 measures L2 coverage
    envelope_forecast: [OBR_EFO_LATEST, EC_AMECO]   # §15 Q12 default: OBR primary, AMECO cross-check
    period_basis_forecast: FY     # OBR/HMT Apr–Mar; convert per §7.10
    period_basis: {anchor: CY, trees: {expenditure: CY, expenditure_esa: CY, revenue: CY}}   # D19
    fy_to_cy_weights: [0.25, 0.75]    # §7.10: April–March sources
    lines_absent: {}                  # D20: no structural zeros
    weo_perimeter_gap_expected: true   # §8.2: small stable perimeter gap expected
    perimeter_break: null
    backward_legs: {}                 # no IMF GFS backward leg (ONS history reaches 1995 itself)
  FRA:
    name: France
    prose_name: France
    aliases: [France, FR]
    currency: EUR
    eurostat_geo: FR                  # DE6: Eurostat / AR / DSM country code
    anchor_family: eurostat
    anchors:
      expenditure: EUROSTAT_GOV10A_EXP
      revenue: EUROSTAT_GOV10A_MAIN   # + EUROSTAT_GOV10A_TAXAG for tax detail
      balance: EUROSTAT_GOV10A_MAIN
    gdp_source: EUROSTAT_NAMA10_GDP
    interest_anchor: level2
    envelope_forecast: [EC_AMECO, EC_DSM]
    period_basis_forecast: CY
    period_basis: {anchor: CY, trees: {expenditure: CY, expenditure_esa: CY, revenue: CY}}   # D19
    fy_to_cy_weights: [0.25, 0.75]    # §7.10 default (no FY source in use)
    lines_absent: {}                  # D20: no structural zeros
    weo_perimeter_gap_expected: false
    perimeter_break: null
    backward_legs: {}                 # no IMF GFS backward leg (Eurostat history reaches 1995 itself)
  DEU:
    name: Germany
    prose_name: Germany
    aliases: [Germany, DE]
    currency: EUR
    eurostat_geo: DE
    anchor_family: eurostat
    anchors:
      expenditure: EUROSTAT_GOV10A_EXP
      revenue: EUROSTAT_GOV10A_MAIN
      balance: EUROSTAT_GOV10A_MAIN
    gdp_source: EUROSTAT_NAMA10_GDP
    interest_anchor: level2
    envelope_forecast: [EC_AMECO, EC_DSM]
    period_basis_forecast: CY
    period_basis: {anchor: CY, trees: {expenditure: CY, expenditure_esa: CY, revenue: CY}}   # D19
    fy_to_cy_weights: [0.25, 0.75]    # §7.10 default (no FY source in use)
    lines_absent: {}                  # D20: no structural zeros
    weo_perimeter_gap_expected: false
    perimeter_break: 1991             # reunification (§14): never extend below
    backward_legs:                    # generic IMF GFS legs (§6.1(2): the same national data
                                      # redistributed), enabled per country (R0 step 6, D-S15-006)
      gfs_cofog:                      # COFOG Level I 1991-94 and every Level II line with a gfs_indicator
        level1_note: "IMF GFS COFOG: redistribution of the same Destatis ESA data (boundary ratio ~1.0 at 1995); XDC levels"
        level2_note: "IMF GFS COFOG group {indicator}: redistribution of the same Destatis ESA data (coverage measured at the boundary); XDC levels"
      gfs_soo: null                   # ESA_EXP lines via the lines.yaml gfs_soo codes: available, not enabled
                                      # (AMECO reaches the 1991 break; enabling it would add a leg after AMECO)
  ITA:                                # EU3_KICKOFF.md (Stage E0, D-S17-001)
    name: Italy
    prose_name: Italy
    aliases: [Italy, IT]
    currency: EUR
    eurostat_geo: IT
    anchor_family: eurostat
    anchors:
      expenditure: EUROSTAT_GOV10A_EXP
      revenue: EUROSTAT_GOV10A_MAIN
      balance: EUROSTAT_GOV10A_MAIN
    gdp_source: EUROSTAT_NAMA10_GDP
    interest_anchor: level2
    envelope_forecast: [EC_AMECO, EC_DSM]
    period_basis_forecast: CY
    period_basis: {anchor: CY, trees: {expenditure: CY, expenditure_esa: CY, revenue: CY}}
    fy_to_cy_weights: [0.25, 0.75]    # §7.10 default (no FY source in use)
    lines_absent: {}
    weo_perimeter_gap_expected: false
    perimeter_break: null
    backward_legs:                    # DE3: Level II 1995-2000 from IMF GFS, as DEU
      gfs_cofog:
        level1_note: "IMF GFS COFOG: redistribution of the same ISTAT ESA data; XDC levels"
        level2_note: "IMF GFS COFOG group {indicator}: redistribution of the same ISTAT ESA data (coverage measured at the boundary); XDC levels"
      gfs_soo: null
    stage_reached: 6                  # EU3_KICKOFF.md: fiscal stages E0-E6 built in one pass (D-S17-008)
    forecast_declarations:            # DE5: lines without a strict forecast because of the country's own sources
      R01: {classification: ESA_REV, status: no_machine_readable_source,
        note: "no machine-readable official forecast of VAT (D.211): the MEF's Documento di finanza pubblica / Documento programmatico di bilancio tables (PDF) and the Ufficio parlamentare di bilancio (www.upbinfo.it, egress-denied); AMECO publishes total D.2 only (UTVG); strict and maximum end at the last actual (EU3_KICKOFF.md DE5)"}
      R02: {classification: ESA_REV, status: no_machine_readable_source,
        note: "no machine-readable official forecast of taxes on production other than VAT: the MEF's Documento di finanza pubblica / Documento programmatico di bilancio tables (PDF) and the Ufficio parlamentare di bilancio (www.upbinfo.it, egress-denied); AMECO UTVG is total D.2 only"}
      R02_A: {classification: ESA_REV, status: no_machine_readable_source,
        note: "no machine-readable official forecast of excise duties (D.214A): the MEF's Documento di finanza pubblica / Documento programmatico di bilancio tables (PDF) and the Ufficio parlamentare di bilancio (www.upbinfo.it, egress-denied)"}
      R03: {classification: ESA_REV, status: no_machine_readable_source,
        note: "no machine-readable official forecast of household income taxes: the MEF's Documento di finanza pubblica / Documento programmatico di bilancio tables (PDF) and the Ufficio parlamentare di bilancio (www.upbinfo.it, egress-denied); AMECO UTYG is total current taxes on income and wealth (D.5) only, no payer split"}
      R04: {classification: ESA_REV, status: no_machine_readable_source,
        note: "no machine-readable official forecast of corporate income taxes: the MEF's Documento di finanza pubblica / Documento programmatico di bilancio tables (PDF) and the Ufficio parlamentare di bilancio (www.upbinfo.it, egress-denied); AMECO UTYG is total D.5 only"}
      R06_E: {classification: ESA_REV, status: no_official_forecast,
        note: "no official forecast of employers' contributions separately: AMECO carries actual contributions in total (UTAG) and imputed (UTIG) but no employer/household split; strict and maximum end at the last actual (the FRA/DEU finding, D-S13-005)"}
      R06_H: {classification: ESA_REV, status: no_official_forecast,
        note: "as R06_E: no employer/household split in any reachable official forecast (D-S13-005)"}
      GF02: {classification: COFOG, status: no_machine_readable_source,
        note: "no machine-readable official projection of defence spending on the COFOG 02 concept: the MEF's Documento di finanza pubblica / Documento programmatico di bilancio tables (PDF) and the Ufficio parlamentare di bilancio (www.upbinfo.it, egress-denied); NATO estimates are a different concept (incl. pensions, excl. some civil items)"}
      GF07: {classification: COFOG, status: grade_below_strict,
        note: "AR 2024 health care baseline measures 87.9% of COFOG 07 at 2024 (grade C: the AWG health care perimeter vs the COFOG function) — no strict forecast; applied in maximum_extension to 2070 per §7.8"}
      GF10: {classification: COFOG, status: grade_below_strict,
        note: "maximum_extension carries the AMECO D.62 dominant-component proxy (to 2027; §7.8, maximum only); the AR 2024 pensions+LTC composite measures 83.1% of GF10 at 2024 (grade C) and its join is withheld by V16 (AMECO vs AR growth divergence +0.0213 > 0.02, D12) pending committee review — no strict forecast"}
      R05: {classification: ESA_REV, status: grade_below_strict,
        note: "AMECO UTKG (capital taxes, D.91) covers 20.2% of the line at 2025 (grade D): not applied in either variant; D7 lists R05 as partial"}
      GF10_2: {classification: COFOG, status: grade_below_strict,
        note: "AR 2024 gross public pensions measure 115.8% of COFOG 10.2 at 2024 (grade D: the AWG pension perimeter includes disability and survivors' pensions that COFOG books in 10.1 and 10.3) — not applied in either variant (the FRA/DEU join measured 1.07, B band; D-S13-002)"}
