# Source register, seeded from §13 (drafted 2026-08-31, UNVERIFIED there) and
# extended with §6.4 fields. `verification.status` values:
#   confirmed_live      — endpoint hit and snapshot taken (none yet: egress blocked, OQ-1)
#   confirmed_search    — existence/release confirmed via web search 2026-08-31; live check pending
#   unverified          — straight from the §13 seed
# source_register.csv is generated from this file; do not hand-edit the CSV.

sources:

  # ---------- Historical / anchor / reconciliation ----------

  EUROSTAT_GOV10A_EXP:
    institution: Eurostat
    object: gov_10a_exp — GG expenditure by COFOG, Level I+II, S13
    trees: [expenditure]
    countries: [FRA, DEU]
    role: anchor
    api:
      kind: sdmx
      base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0
      data_path: data/dataflow/ESTAT/gov_10a_exp/1.0/
      format: csvdata
      filter_hint: "S13, MIO_NAC, all COFOG99, FR+DE"
    landing: https://ec.europa.eu/eurostat/databrowser/view/gov_10a_exp/default/table?lang=en
    verification:
      status: confirmed_live
      checked: 2026-09-03
      last_update_observed: "2026-07-21"      # dataflow UPDATE_DATA annotation, detect-vintages 2026-09-03
      last_observation: 2025                   # some countries provisional; t+11m rule
      note: from 1995 for FRA/DEU as expected; harvested since session 2 (OQ-1 resolved)

  EUROSTAT_GOV10A_MAIN:
    institution: Eurostat
    object: gov_10a_main — ESA main aggregates incl. TR, TE, B9, D41 both directions, D61, P11_P12_P131
    trees: [revenue, balance]
    countries: [FRA, DEU]
    role: anchor
    api:
      kind: sdmx
      base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0
      data_path: data/dataflow/ESTAT/gov_10a_main/1.0/
      format: csvdata
    landing: https://ec.europa.eu/eurostat/databrowser/view/gov_10a_main/default/table?lang=en
    verification: {status: confirmed_live, checked: 2026-09-03,
                   last_update_observed: "2026-07-21", last_observation: 2025,
                   note: UPDATE_DATA annotation per detect-vintages 2026-09-03}

  EUROSTAT_GOV10A_TAXAG:
    institution: Eurostat
    object: gov_10a_taxag — D211, D51A_C1, D51B_C2, D59, D91 tax detail
    trees: [revenue]
    countries: [FRA, DEU]
    role: anchor_detail
    api:
      kind: sdmx
      base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0
      data_path: data/dataflow/ESTAT/gov_10a_taxag/1.0/
      format: csvdata
    landing: https://ec.europa.eu/eurostat/databrowser/view/gov_10a_taxag/default/table?lang=en
    verification: {status: confirmed_live, checked: 2026-09-03,
                   last_update_observed: "2026-07-21", last_observation: 2025,
                   note: UPDATE_DATA annotation per detect-vintages 2026-09-03}

  EUROSTAT_NAMA10_GDP:
    institution: Eurostat
    object: nama_10_gdp — nominal GDP (B1GQ, current prices, MIO_NAC)
    trees: [denominator]
    countries: [FRA, DEU]
    role: gdp
    api:
      kind: sdmx
      base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0
      data_path: data/dataflow/ESTAT/nama_10_gdp/1.0/
      format: csvdata
    verification: {status: confirmed_live, checked: 2026-09-03,
                   last_update_observed: "2026-09-03", last_observation: 2025,
                   note: UPDATE_DATA annotation per detect-vintages 2026-09-03}

  ONS_ESA_T11:
    institution: ONS
    object: ESA Table 11 — GG expenditure by function, Level I+II
    trees: [expenditure]
    countries: [GBR]
    role: anchor
    api:
      kind: xlsx_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esatable11annualexpenditureofgeneralgovernment
      note: versioned xlsx from landing page; archived vintages via "previous versions" for pre-1995
    verification:
      status: confirmed_live
      checked: 2026-09-03
      last_update_observed: "2026-04-22"     # dataset releaseDate per detect-vintages 2026-09-03
      note: dataset page live and updated April 2026; harvested since session 2 (OQ-1 resolved)

  ONS_GG_RECEIPTS:
    institution: ONS
    object: "ESA Table 2 — GG main aggregates: TR, TE, B9, receipts by ESA code, D41 both directions"
    trees: [revenue, balance]
    countries: [GBR]
    role: anchor
    api:
      kind: xls_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esatable2mainaggregatesofgeneralgovernment
      file: esatable0200.xls
      note: resolved live (D-S0-006); latest file served at {landing}/current/esatable0200.xls
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2026-06-18"     # June 2026 EDP transmission
      note: income tax / NICs / CT mapping for R03/R04/R06 comes from ONS_TAX_DETAIL + ONS_TAX_LIST (crosswalk)

  ONS_TAX_DETAIL:
    institution: ONS
    object: "ESA questionnaire table 9 — detailed tax and social contribution receipts by type and receiving subsector (D211, D51 splits, D61, D91)"
    trees: [revenue]
    countries: [GBR]
    role: anchor_detail
    api:
      kind: xls_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esaquestionnairedetailedtaxandsocialcontributions
      file: esantl0999.xls
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2026-06-18"
      note: resolved live (D-S0-006); GBR analogue of EUROSTAT_GOV10A_TAXAG

  ONS_TAX_LIST:
    institution: ONS
    object: "ESA table 9 — national tax list (per-tax detail with ESA codes; income tax / NICs / CT mapping evidence)"
    trees: [revenue]
    countries: [GBR]
    role: crosswalk_evidence
    api:
      kind: xls_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esatable9listoftaxes
      file: esatable0900.xls
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2023-10-26"
      note: "FLAGGED stale: file last saved 2023-10; use for tax-to-ESA mapping evidence only, not levels — ONS_TAX_DETAIL carries the current levels"

  ONS_PSF_INTEREST:
    institution: ONS
    object: GG interest payable and receivable, accrued (D.41) — served by the D41 rows of ESA Table 2
    trees: [expenditure, revenue]
    countries: [GBR]
    role: interest_history
    api:
      kind: xls_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esatable2mainaggregatesofgeneralgovernment
      file: esatable0200.xls
      note: same physical dataset as ONS_GG_RECEIPTS (D-S0-006); kept as a distinct register
            entry because the role (D10 interest history) and the rows used differ
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2026-06-18"

  ONS_GDP:
    institution: ONS
    object: "YBHA — GDP at market prices, current prices, £m, calendar years (QNA)"
    trees: [denominator]
    countries: [GBR]
    role: gdp
    api:
      kind: timeseries_json
      landing: https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/ybha/qna
      note: resolved live (D-S0-006); annual values from 1948; ESA Table 2 carries no GDP row
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2026-06-29"

  INSEE_APU:
    institution: INSEE
    object: Dépenses et recettes des administrations publiques (pre-1995 base series)
    trees: [expenditure, revenue]
    countries: [FRA]
    role: backward_extension
    api: {kind: html_download, landing: https://www.insee.fr/fr/statistiques}
    verification: {status: unverified, note: Stage 2 concern; perimeter pre-ESA95 to document}

  DESTATIS_81000:
    institution: Destatis
    object: GENESIS 81000 family; Fachserie 18 R1.4 archived (1991 start check)
    trees: [expenditure, revenue]
    countries: [DEU]
    role: backward_extension
    api: {kind: genesis_api, landing: https://www-genesis.destatis.de}
    verification: {status: unverified, note: Stage 2 concern}

  IMF_GFS:
    institution: IMF
    object: GFS COFOG and main aggregates (reconciliation only, D1)
    trees: [expenditure, revenue]
    countries: [GBR, FRA, DEU, USA]   # USA added in Stage U0 (kickoff §13; GFS_COFOG 1972-2024, GFS_SOO 1972-2025)
    role: reconciliation
    api:
      kind: sdmx
      base: https://api.imf.org/external/sdmx/3.0
      dataflow_cofog: IMF.STA,GFS_COFOG,11.0.0
      dataflow_main: IMF.STA,GFS_SOO,12.0.0
      note: dataflow ids resolved live 2026-08-31 (D-S0-006); GFS_SOO is the
            main-aggregates companion (Statement of Operations). Legacy
            dataservices.imf.org paths NOT used (portal migrated 2025).
    landing: https://data.imf.org/Datasets/GFS_COFOG
    verification: {status: confirmed_live, checked: 2026-08-31}

  OECD_T11:
    institution: OECD
    object: Table 11 — annual government expenditure by function, COFOG (secondary for GBR/FRA/DEU; the COFOG ANCHOR of the oecd_sna family, D18 — USA 1970-2024, Level I only, no GF05 rows)
    trees: [expenditure]
    countries: [GBR, FRA, DEU, USA]   # USA added in Stage U0 (D-S16-004)
    role: secondary
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.SDD.NAD,DSD_NASEC10@DF_TABLE11,1.1
      note: resolved live from the OECD catalog 2026-08-31 (D-S0-006); 13-dim
            DSD_NASEC10, filtered to S13 per country
    verification: {status: confirmed_live, checked: 2026-08-31}

  OECD_RS:
    institution: OECD
    object: Revenue Statistics, 1965– (backward extension R01–R06 via crosswalk, D15)
    trees: [revenue]
    countries: [GBR, FRA, DEU, USA]   # USA added in Stage U0 (1965-2024 S13 XDC)
    role: backward_extension
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.CTP.TPS,DSD_REV_COMP_OECD@DF_RSOECD,2.0
      note: "resolved live 2026-08-31 (D-S0-006): DF_RSOECD (OECD members) carries
            S13 XDC from 1965 as D15 requires; the §13-era candidate DF_RSGLOBAL
            only starts 1990 and is not used"
    verification: {status: confirmed_live, checked: 2026-08-31}

  IMF_WEO:
    institution: IMF
    object: "WEO: GGR, GGX, GGXCNL, GGXONLB, NGDP (LCU); vintages actually exposed (Q11)"
    trees: [reconciliation]
    countries: [GBR, FRA, DEU, USA]   # USA added in Stage U0: fiscal series 2001-2031, NGDP 1980-2031; GFSM basis with documented adjustments (§8.2 perimeter rule)
    role: reconciliation_only          # §8 only; never an envelope or extension source (D4, D13)
    api:
      kind: sdmx
      base: https://api.imf.org/external/sdmx/3.0
      agency: IMF.RES
      dataflow: WEO
      # §11.7 / D-S6-001: THIS mapping is the vintage register the pipeline
      # runs on (endpoints.weo_vintages() reads it) — latest first. A new WEO
      # edition is registered by adding an entry here and re-running
      # fetch/build/reconcile/report: a config change plus rebuild, never a
      # code change. Snapshot new editions promptly — the API drops old ones
      # (D-S0-007). `detect-vintages` diffs the live catalog against this map.
      vintages:
        "2026-04": {dataflow: WEO, version: "9.0.0", publication: "2026-04-14"}
        "2025-10": {dataflow: WEO_2025_OCT_VINTAGE, version: "1.0.0", publication: "2025-10-14"}
        "2025-04": {dataflow: WEO, version: "6.0.0", publication: "2025-04-22"}
      note: "vintages resolved live 2026-08-31 (D-S0-006, Q11): the API exposes exactly 3.
            One source_id per vintage at ingest: IMF_WEO_2026_04, IMF_WEO_2025_10, IMF_WEO_2025_04."
    landing: https://data.imf.org/en/datasets/IMF.RES:WEO
    verification:
      status: confirmed_live
      checked: 2026-08-31
      latest_vintage: "2026-04"        # WEO April 2026, publication date 2026-04-14 (per API attributes)
      vintages_exposed: ["2026-04", "2025-10", "2025-04"]
      note: fewer than the Q11 target of 5-10 — per Q11, take what the API exposes and
            note the earliest (2025-04)

  EC_AMECO:
    institution: European Commission (DG ECFIN)
    object: "AMECO: TR, TE, B9, interest, D2, D5, D61 and sub-items, nominal GDP; 2-year forecast"
    trees: [envelope, revenue, expenditure]
    countries: [GBR, FRA, DEU, USA]   # USA added in Stage U0: chapters 6/16/18 carry USA on ESA names (values = OECD T12, scoping §3.2)
    role: envelope
    api:
      kind: bulk_zip
      landing: https://economy-finance.ec.europa.eu/economic-research-and-databases/economic-databases/ameco-database/download-annual-data-set-macro-economic-database-ameco_en
      zip_base: https://ec.europa.eu/economy_finance/db_indicators/ameco/documents
      chapters: [6, 16, 17, 18]   # domestic product; GG revenue/expenditure; EDP; public debt
      note: zip URLs ameco{n}.zip resolved live 2026-08-31 (D-S0-006); UK coverage verified at pull
    verification:
      status: confirmed_search
      checked: 2026-08-31
      last_update_observed: "2026-06-03"   # Spring 2026 Economic Forecast vintage
      note: live pull pending (OQ-1)

  # ---------- United States (REPLICATION_KICKOFF.md §13.1; Stage U0, verified live
  # ---------- 2026-09-21, D-S16-004). period_basis: FY on the federal October–
  # ---------- September sources (CBO, OMB), CY otherwise. ----------

  OECD_T12_EXP:
    institution: OECD (BEA)
    object: "Table 12 — annual government non-financial accounts, expenditure flow (DF_TABLE12_EXP): D1, P2, D62, D632, D41, D4, D3, D29, D5, D7, D8, D9, P5, P51G, NP, OTE; S13, XDC, UNIT_MULT 6"
    trees: [expenditure_esa, balance]
    countries: [USA]
    role: anchor
    period_basis: CY
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.SDD.NAD,DSD_NASEC10@DF_TABLE12_EXP,1.1
      note: 13-dim DSD_NASEC10, key A.{iso3}.S13.......... (one pull per country)
    landing: https://data-explorer.oecd.org/?fs[0]=Topic%2C1%7CEconomy%23ECO%23%7CNational%20accounts%23ECO_NAC%23&pg=0&snb=54
    verification:
      status: confirmed_live
      checked: 2026-09-21
      last_observation: 2024
      note: "USA 1970-2024 every item; E01..E09 = OTE to USD 0.002 mn in every year; D29, D5, D8, D39, D92, D4N, P5M identically zero; D632 identically zero (D20 E04)"

  OECD_T12_REV:
    institution: OECD (BEA)
    object: "Table 12 — annual government non-financial accounts, revenue flow (DF_TABLE12_REV): D2, D21, D211, D29, D5, D61, D611, D613, D612_D614, D4, D41, D4N, D7, D9, D91, D39, P1O (= P1M + P131), OTR; S13, XDC"
    trees: [revenue, balance]
    countries: [USA]
    role: anchor
    period_basis: CY
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.SDD.NAD,DSD_NASEC10@DF_TABLE12_REV,1.1
      note: key A.{iso3}.S13..........
    landing: https://data-explorer.oecd.org/?fs[0]=Topic%2C1%7CEconomy%23ECO%23%7CNational%20accounts%23ECO_NAC%23&pg=0&snb=54
    verification:
      status: confirmed_live
      checked: 2026-09-21
      last_observation: 2024
      note: "USA 1970-2024; OTR = D2 + D5 + D61 + D4 + D7 + D9 + D39 + P1O to USD 0.002 mn; D211 identically zero (D20 R01); D611 + D613 + D612_D614 = D61"

  OECD_T12_BAL:
    institution: OECD (BEA)
    object: "Table 12 — annual government non-financial accounts, balancing items (DF_TABLE12_BAL): B9 net lending, B8G/B8N saving, B2N operating surplus, B1G/B1N value added, B5N, B6N; S13, XDC"
    trees: [balance]
    countries: [USA]
    role: anchor
    period_basis: CY
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.SDD.NAD,DSD_NASEC10@DF_TABLE12_BAL,1.1
      note: key A.{iso3}.S13..........
    landing: https://data-explorer.oecd.org/?fs[0]=Topic%2C1%7CEconomy%23ECO%23%7CNational%20accounts%23ECO_NAC%23&pg=0&snb=54
    verification:
      status: confirmed_live
      checked: 2026-09-21
      last_observation: 2024
      note: "USA 1970-2024; B9 = OTR - OTE to USD 0.001 mn (V23 exact within source)"

  OECD_T10:
    institution: OECD (BEA)
    object: "Table 10 — annual government taxes and social contributions receipts (DF_TABLE10): D51M/D51O (incl. holding gains), D51A/D51B/D51C1/D51C2, D214A, D2121, D29 splits, D59, D91, D611/D613/D612; S13, XDC"
    trees: [revenue]
    countries: [USA]
    role: anchor_detail
    period_basis: CY
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.SDD.NAD,DSD_NASEC10@DF_TABLE10,1.1
      note: key A.{iso3}.S13..........
    landing: https://data-explorer.oecd.org/?fs[0]=Topic%2C1%7CEconomy%23ECO%23%7CNational%20accounts%23ECO_NAC%23&pg=0&snb=54
    verification:
      status: confirmed_live
      checked: 2026-09-21
      last_observation: 2024
      note: "USA 1970-2024; D51M + D51O = D51 and D51 + D59 = D5 exactly; T10 D5 differs from T12 D5 by up to USD 5.8 bn in some years (transmission drift, lands in R05); T10 D61 differs from T12 D61 by up to 0.7 bn (R06 and its split take T12)"

  OECD_T1:
    institution: OECD
    object: "Table 1 — annual GDP and components, expenditure approach (DF_TABLE1_EXPENDITURE): B1GQ, current prices (V), national currency (XDC), UNIT_MULT 6 — the D18 denominator, same vintage as the government tables"
    trees: [denominator]
    countries: [USA]
    role: gdp
    period_basis: CY
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.SDD.NAD,DSD_NAMAIN10@DF_TABLE1_EXPENDITURE,2.0
      note: "flow id resolved live 2026-09-21 from the OECD.SDD.NAD catalog (the §13 seed said 'to resolve in U0'): 12-dim DSD_NAMAIN10, key A.{iso3}...B1GQ.......; the reader keeps XDC / current prices"
    landing: https://data-explorer.oecd.org/?fs[0]=Topic%2C1%7CEconomy%23ECO%23%7CNational%20accounts%23ECO_NAC%23&pg=0&snb=54
    verification:
      status: confirmed_live
      checked: 2026-09-21
      last_observation: 2025
      note: "USA B1GQ 1970-2025; 2024 = USD 29,298,013 mn, equal to the OECD EO GDP series"

  BEA_NIPA:
    institution: BEA
    object: "NIPA flat files: NipaDataA.txt (annual, 1929-), NipaDataQ.txt (quarterly), SeriesRegister.txt (series code -> table:line cells); Tables 3.1/3.2/3.3 (1929-2025), 3.16/3.17 by function (1959-2024), 3.18B (FY)"
    trees: [expenditure, expenditure_esa, revenue]
    countries: [USA]
    role: secondary
    period_basis: CY
    concept_note: NIPA presentation — sales netted against consumption (TR/TE below the OECD grossed totals by ≈ USD 1.1 trn, §3); Table 3.16 is current expenditures (CFC in, investment out; never mixed with the ESA total without Table 3.17, §14); Level II proxies per D26 (level2_proxy_actual, B); 1929-1969 backward legs per §7.16; the only source with 2025
    api:
      kind: txt_flat_files
      base: https://apps.bea.gov/national/Release/TXT
      files: [NipaDataA.txt, NipaDataQ.txt, SeriesRegister.txt]
      note: the BEA API needs a registered key and is not used (§14)
    landing: https://apps.bea.gov/iTable/?reqid=19&step=2&isuri=1&categories=survey
    verification:
      status: confirmed_live
      checked: 2026-09-21
      last_update_observed: "2026-08-26"     # Last-Modified of the flat files
      note: "register-driven lookup (readers_bea): T31600 lines 5 (interest payments), 14 (transportation), 38 (retirement), 40 (unemployment), total-government block; T31700 carries gross investment by function at Level I only"

  FRB_Z1:
    institution: Federal Reserve / BEA
    object: "Z.1 Financial Accounts CSV bundle: S.1311 federal integrated macroeconomic accounts, F.106 / L.210 Treasury securities by holder"
    trees: [debt]
    countries: [USA]
    role: debt_secondary
    period_basis: CY
    api:
      kind: zip_download
      landing: https://www.federalreserve.gov/releases/z1/
      file: https://www.federalreserve.gov/releases/z1/current/z1_csv_files.zip
    verification:
      status: confirmed_live
      checked: 2026-09-21
      note: "8.3 MB zip snapshotted in U0 for the debt extension's step B (UD1); not read by the fiscal package"

  OECD_EO:
    institution: OECD
    object: "Economic Outlook (DSD_EO@DF_EO,1.5): USA general-government measures YPGT, YPG, GGINTP, GGINTR, TYH, TYB, TIND, SSRG, SSPG, IGAA, TKPG, CGAA, NLGQ, GGFLQ, GDP — XDC in units (UNIT_MULT 0), ratios in PT_B1GQ"
    trees: [envelope, expenditure_esa, revenue]
    countries: [USA]
    role: envelope
    period_basis: CY
    horizon_year: 2027
    last_actual_year: 2025
    concept_note: "SNA-like GG lines; EO totals differ from T12 OTR/OTE by concept (YPGT 2024 = 11.62 trn vs OTE 11.59 trn); GGINTP is the NIPA/IMA interest concept incl. imputed pension interest (1,397.6 bn 2024 vs T12 D41 1,384.6 bn); SSPG = D62 and SSRG = D61 and TIND = D2 exactly"
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.ECO.MAD,DSD_EO@DF_EO,1.5
      note: key {iso3}.<M1>+<M2>+….A
    landing: https://www.oecd.org/en/data/datasets/oecd-economic-outlook-statistics-and-projections.html
    verification:
      status: confirmed_live
      checked: 2026-09-21
      latest_vintage: "2026-06"          # EO 119 (June 2026)
      note: "USA 1960-2027 on every measure; forecast rank 1/2 source for U3 (no reader for the envelope role yet — AMECO is the primary envelope, OECD_EO the second entry of envelope_forecast)"

  OECD_EO_LTB:
    institution: OECD
    object: "Economic Outlook long-term baseline scenarios (balance, debt, interest rates to 2100, % GDP)"
    countries: [USA]
    role: memorandum
