# Source register, seeded from §13 (drafted 2026-08-31, UNVERIFIED there) and
# extended with §6.4 fields. `verification.status` values:
#   confirmed_live      — endpoint hit and snapshot taken (none yet: egress blocked, OQ-1)
#   confirmed_search    — existence/release confirmed via web search 2026-08-31; live check pending
#   unverified          — straight from the §13 seed
# source_register.csv is generated from this file; do not hand-edit the CSV.

sources:

  # ---------- Historical / anchor / reconciliation ----------

  EUROSTAT_GOV10A_EXP:
    institution: Eurostat
    object: gov_10a_exp — GG expenditure by COFOG, Level I+II, S13
    trees: [expenditure]
    countries: [FRA, DEU]
    role: anchor
    api:
      kind: sdmx
      base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0
      data_path: data/dataflow/ESTAT/gov_10a_exp/1.0/
      format: csvdata
      filter_hint: "S13, MIO_NAC, all COFOG99, FR+DE"
    landing: https://ec.europa.eu/eurostat/databrowser/view/gov_10a_exp/default/table?lang=en
    verification:
      status: confirmed_live
      checked: 2026-09-03
      last_update_observed: "2026-07-21"      # dataflow UPDATE_DATA annotation, detect-vintages 2026-09-03
      last_observation: 2025                   # some countries provisional; t+11m rule
      note: from 1995 for FRA/DEU as expected; harvested since session 2 (OQ-1 resolved)

  EUROSTAT_GOV10A_MAIN:
    institution: Eurostat
    object: gov_10a_main — ESA main aggregates incl. TR, TE, B9, D41 both directions, D61, P11_P12_P131
    trees: [revenue, balance]
    countries: [FRA, DEU]
    role: anchor
    api:
      kind: sdmx
      base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0
      data_path: data/dataflow/ESTAT/gov_10a_main/1.0/
      format: csvdata
    landing: https://ec.europa.eu/eurostat/databrowser/view/gov_10a_main/default/table?lang=en
    verification: {status: confirmed_live, checked: 2026-09-03,
                   last_update_observed: "2026-07-21", last_observation: 2025,
                   note: UPDATE_DATA annotation per detect-vintages 2026-09-03}

  EUROSTAT_GOV10A_TAXAG:
    institution: Eurostat
    object: gov_10a_taxag — D211, D51A_C1, D51B_C2, D59, D91 tax detail
    trees: [revenue]
    countries: [FRA, DEU]
    role: anchor_detail
    api:
      kind: sdmx
      base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0
      data_path: data/dataflow/ESTAT/gov_10a_taxag/1.0/
      format: csvdata
    landing: https://ec.europa.eu/eurostat/databrowser/view/gov_10a_taxag/default/table?lang=en
    verification: {status: confirmed_live, checked: 2026-09-03,
                   last_update_observed: "2026-07-21", last_observation: 2025,
                   note: UPDATE_DATA annotation per detect-vintages 2026-09-03}

  EUROSTAT_NAMA10_GDP:
    institution: Eurostat
    object: nama_10_gdp — nominal GDP (B1GQ, current prices, MIO_NAC)
    trees: [denominator]
    countries: [FRA, DEU]
    role: gdp
    api:
      kind: sdmx
      base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0
      data_path: data/dataflow/ESTAT/nama_10_gdp/1.0/
      format: csvdata
    verification: {status: confirmed_live, checked: 2026-09-03,
                   last_update_observed: "2026-09-03", last_observation: 2025,
                   note: UPDATE_DATA annotation per detect-vintages 2026-09-03}

  ONS_ESA_T11:
    institution: ONS
    object: ESA Table 11 — GG expenditure by function, Level I+II
    trees: [expenditure]
    countries: [GBR]
    role: anchor
    api:
      kind: xlsx_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esatable11annualexpenditureofgeneralgovernment
      note: versioned xlsx from landing page; archived vintages via "previous versions" for pre-1995
    verification:
      status: confirmed_live
      checked: 2026-09-03
      last_update_observed: "2026-04-22"     # dataset releaseDate per detect-vintages 2026-09-03
      note: dataset page live and updated April 2026; harvested since session 2 (OQ-1 resolved)

  ONS_GG_RECEIPTS:
    institution: ONS
    object: "ESA Table 2 — GG main aggregates: TR, TE, B9, receipts by ESA code, D41 both directions"
    trees: [revenue, balance]
    countries: [GBR]
    role: anchor
    api:
      kind: xls_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esatable2mainaggregatesofgeneralgovernment
      file: esatable0200.xls
      note: resolved live (D-S0-006); latest file served at {landing}/current/esatable0200.xls
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2026-06-18"     # June 2026 EDP transmission
      note: income tax / NICs / CT mapping for R03/R04/R06 comes from ONS_TAX_DETAIL + ONS_TAX_LIST (crosswalk)

  ONS_TAX_DETAIL:
    institution: ONS
    object: "ESA questionnaire table 9 — detailed tax and social contribution receipts by type and receiving subsector (D211, D51 splits, D61, D91)"
    trees: [revenue]
    countries: [GBR]
    role: anchor_detail
    api:
      kind: xls_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esaquestionnairedetailedtaxandsocialcontributions
      file: esantl0999.xls
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2026-06-18"
      note: resolved live (D-S0-006); GBR analogue of EUROSTAT_GOV10A_TAXAG

  ONS_TAX_LIST:
    institution: ONS
    object: "ESA table 9 — national tax list (per-tax detail with ESA codes; income tax / NICs / CT mapping evidence)"
    trees: [revenue]
    countries: [GBR]
    role: crosswalk_evidence
    api:
      kind: xls_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esatable9listoftaxes
      file: esatable0900.xls
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2023-10-26"
      note: "FLAGGED stale: file last saved 2023-10; use for tax-to-ESA mapping evidence only, not levels — ONS_TAX_DETAIL carries the current levels"

  ONS_PSF_INTEREST:
    institution: ONS
    object: GG interest payable and receivable, accrued (D.41) — served by the D41 rows of ESA Table 2
    trees: [expenditure, revenue]
    countries: [GBR]
    role: interest_history
    api:
      kind: xls_download
      landing: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esatable2mainaggregatesofgeneralgovernment
      file: esatable0200.xls
      note: same physical dataset as ONS_GG_RECEIPTS (D-S0-006); kept as a distinct register
            entry because the role (D10 interest history) and the rows used differ
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2026-06-18"

  ONS_GDP:
    institution: ONS
    object: "YBHA — GDP at market prices, current prices, £m, calendar years (QNA)"
    trees: [denominator]
    countries: [GBR]
    role: gdp
    api:
      kind: timeseries_json
      landing: https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/ybha/qna
      note: resolved live (D-S0-006); annual values from 1948; ESA Table 2 carries no GDP row
    verification:
      status: confirmed_live
      checked: 2026-08-31
      last_update_observed: "2026-06-29"

  INSEE_APU:
    institution: INSEE
    object: Dépenses et recettes des administrations publiques (pre-1995 base series)
    trees: [expenditure, revenue]
    countries: [FRA]
    role: backward_extension
    api: {kind: html_download, landing: https://www.insee.fr/fr/statistiques}
    verification: {status: unverified, note: Stage 2 concern; perimeter pre-ESA95 to document}

  DESTATIS_81000:
    institution: Destatis
    object: GENESIS 81000 family; Fachserie 18 R1.4 archived (1991 start check)
    trees: [expenditure, revenue]
    countries: [DEU]
    role: backward_extension
    api: {kind: genesis_api, landing: https://www-genesis.destatis.de}
    verification: {status: unverified, note: Stage 2 concern}

  IMF_GFS:
    institution: IMF
    object: GFS COFOG and main aggregates (reconciliation only, D1)
    trees: [expenditure, revenue]
    countries: [GBR, FRA, DEU]
    role: reconciliation
    api:
      kind: sdmx
      base: https://api.imf.org/external/sdmx/3.0
      dataflow_cofog: IMF.STA,GFS_COFOG,11.0.0
      dataflow_main: IMF.STA,GFS_SOO,12.0.0
      note: dataflow ids resolved live 2026-08-31 (D-S0-006); GFS_SOO is the
            main-aggregates companion (Statement of Operations). Legacy
            dataservices.imf.org paths NOT used (portal migrated 2025).
    landing: https://data.imf.org/Datasets/GFS_COFOG
    verification: {status: confirmed_live, checked: 2026-08-31}

  OECD_T11:
    institution: OECD
    object: Table 11 — annual government expenditure by function, COFOG (secondary)
    trees: [expenditure]
    countries: [GBR, FRA, DEU]
    role: secondary
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.SDD.NAD,DSD_NASEC10@DF_TABLE11,1.1
      note: resolved live from the OECD catalog 2026-08-31 (D-S0-006); 13-dim
            DSD_NASEC10, filtered to S13 per country
    verification: {status: confirmed_live, checked: 2026-08-31}

  OECD_RS:
    institution: OECD
    object: Revenue Statistics, 1965– (backward extension R01–R06 via crosswalk, D15)
    trees: [revenue]
    countries: [GBR, FRA, DEU]
    role: backward_extension
    api:
      kind: sdmx
      base: https://sdmx.oecd.org/public/rest
      dataflow: OECD.CTP.TPS,DSD_REV_COMP_OECD@DF_RSOECD,2.0
      note: "resolved live 2026-08-31 (D-S0-006): DF_RSOECD (OECD members) carries
            S13 XDC from 1965 as D15 requires; the §13-era candidate DF_RSGLOBAL
            only starts 1990 and is not used"
    verification: {status: confirmed_live, checked: 2026-08-31}

  IMF_WEO:
    institution: IMF
    object: "WEO: GGR, GGX, GGXCNL, GGXONLB, NGDP (LCU); vintages actually exposed (Q11)"
    trees: [reconciliation]
    countries: [GBR, FRA, DEU]
    role: reconciliation_only          # §8 only; never an envelope or extension source (D4, D13)
    api:
      kind: sdmx
      base: https://api.imf.org/external/sdmx/3.0
      agency: IMF.RES
      dataflow: WEO
      # §11.7 / D-S6-001: THIS mapping is the vintage register the pipeline
      # runs on (endpoints.weo_vintages() reads it) — latest first. A new WEO
      # edition is registered by adding an entry here and re-running
      # fetch/build/reconcile/report: a config change plus rebuild, never a
      # code change. Snapshot new editions promptly — the API drops old ones
      # (D-S0-007). `detect-vintages` diffs the live catalog against this map.
      vintages:
        "2026-04": {dataflow: WEO, version: "9.0.0", publication: "2026-04-14"}
        "2025-10": {dataflow: WEO_2025_OCT_VINTAGE, version: "1.0.0", publication: "2025-10-14"}
        "2025-04": {dataflow: WEO, version: "6.0.0", publication: "2025-04-22"}
      note: "vintages resolved live 2026-08-31 (D-S0-006, Q11): the API exposes exactly 3.
            One source_id per vintage at ingest: IMF_WEO_2026_04, IMF_WEO_2025_10, IMF_WEO_2025_04."
    landing: https://data.imf.org/en/datasets/IMF.RES:WEO
    verification:
      status: confirmed_live
      checked: 2026-08-31
      latest_vintage: "2026-04"        # WEO April 2026, publication date 2026-04-14 (per API attributes)
      vintages_exposed: ["2026-04", "2025-10", "2025-04"]
      note: fewer than the Q11 target of 5-10 — per Q11, take what the API exposes and
            note the earliest (2025-04)

  EC_AMECO:
    institution: European Commission (DG ECFIN)
    object: "AMECO: TR, TE, B9, interest, D2, D5, D61 and sub-items, nominal GDP; 2-year forecast"
    trees: [envelope, revenue, expenditure]
    countries: [GBR, FRA, DEU]
    role: envelope
    api:
      kind: bulk_zip
      landing: https://economy-finance.ec.europa.eu/economic-research-and-databases/economic-databases/ameco-database/download-annual-data-set-macro-economic-database-ameco_en
      zip_base: https://ec.europa.eu/economy_finance/db_indicators/ameco/documents
      chapters: [6, 16, 17, 18]   # domestic product; GG revenue/expenditure; EDP; public debt
      note: zip URLs ameco{n}.zip resolved live 2026-08-31 (D-S0-006); UK coverage verified at pull
    verification:
      status: confirmed_search
      checked: 2026-08-31
      last_update_observed: "2026-06-03"   # Spring 2026 Economic Forecast vintage
      note: live pull pending (OQ-1)

  # ---------- Forecast (Stage 3+; registered now, verified before use) ----------

  OBR_EFO_LATEST:
    institution: OBR
    object: Economic and Fiscal Outlook March 2026 — annex tables A.1-A.12 + detailed forecast tables (receipts, expenditure, aggregates incl. 6.3 GG transactions, debt interest, economy, long-term determinants)
    countries: [GBR]
    lines: [R01, R02, R03, R04, R05, R06, GF01_7, GF02, GF10_components, envelope]
    horizon_claimed: 5
    concept_note: Public sector, FY (Apr-Mar), accrued incl. index-linked uplift; convert per §7.10; coverage_share on GG anchor (§7.11); table 6.3 is GG perimeter (forecast years only)
    api: {kind: xlsx_download, landing: https://obr.uk/efo/economic-and-fiscal-outlook-march-2026/}
    verification:
      status: resolved_manual
      checked: 2026-09-05
      last_update_observed: "2026-03-24"   # EFO March 2026 publication
      latest_vintage: "2026-03"
      forecast_horizon: "2030-31"
      note: "obr.uk Cloudflare challenge unchanged (OQ-6); hand-retrieved by AC
             2026-09-03 and ingested via `ggfiscal ingest-file` (D-S7-001);
             raw bytes committed to git since no machine fetch path exists"

  OBR_FRS:
    institution: OBR
    object: Fiscal Risks and Sustainability, July 2025 — chapter charts and tables (% GDP long-term projections)
    countries: [GBR]
    lines: [GF07, GF09, GF10_components, GF01_7, major_receipts]
    concept_note: Public sector perimeter; % GDP
    api: {kind: xlsx_download, landing: https://obr.uk/frs/fiscal-risks-and-sustainability-july-2025/}
    verification:
      status: resolved_manual
      checked: 2026-09-05
      last_update_observed: "2025-07-08"
      latest_vintage: "2025-07"
      note: "supersedes the §13 seed id OBR_FRS_2026: the July 2025 edition is what
             the committee hand-retrieved (D-S7-001); whether a July 2026 edition
             exists could not be confirmed from this environment (obr.uk blocked,
             OQ-6) — re-check when access exists"

  OBR_PSF_DATABANK:
    institution: OBR
    object: Public sector finances aggregates databank (August 2026) — long FY history of PS aggregates incl. welfare spending, debt interest, receipts
    countries: [GBR]
    lines: [history_complement]
    role: history_complement
    concept_note: Public sector, FY, National Accounts basis; used for FY history where EFO tables lack outturn years (§7.10 conversion needs FY t-1)
    api: {kind: xlsx_download, landing: https://obr.uk/data/}
    verification: {status: resolved_manual, checked: 2026-09-05,
                   last_update_observed: "2026-08-04",
                   note: "hand-retrieved by AC 2026-09-05 (D-S7-001)"}

  OBR_HIST_PF:
    institution: OBR
    object: Historical public finances database — long-run UK fiscal history (candidate for the OQ-5 pre-1987 interest quick win; not yet used)
    countries: [GBR]
    lines: [history_candidate]
    role: history_complement
    api: {kind: xlsx_download, landing: https://obr.uk/data/}
    verification: {status: resolved_manual, checked: 2026-09-05,
                   note: "hand-retrieved by AC 2026-09-05 (D-S7-001); snapshotted for
                   future backward-extension work, no rows built from it yet"}

  HMT_PESA:
    institution: HMT
    object: "PESA 2026 (July 2026), chapter 1: departmental budgets — MoD RDEL+CDEL outturns 2021-22..2025-26 + SR plans to 2028-29 (table 1.9, £mn)"
    countries: [GBR]
    lines: [GF02]
    concept_note: Departmental Expenditure Limits, budgeting basis, FY; central government (MoD) vs COFOG GF02 GG — coverage measured; §15 Q7 (defence plans strict B if share >= 90%)
    api:
      kind: xlsx_download
      landing: https://www.gov.uk/government/statistics/public-expenditure-statistical-analyses-2026
      file: https://assets.publishing.service.gov.uk/media/6a57728b822fbe6b8245c9a1/PESA_2026_CP_Chapter_1_tables.xlsx
    verification:
      status: confirmed_live
      checked: 2026-09-05
      last_update_observed: "2026-07-16"
      note: "supersedes the §13 seed UK_DEFENCE_PLAN entry: gov.uk/assets.publishing
             allowlisted 2026-09-05 (OQ-6 partial unblock, D-S7-002); PESA carries the
             SR25 defence settlement the seed pointed at, machine-readable"

  EC_AGEING_2024:
    institution: European Commission
    object: 2024 Ageing Report statistical annex (annual, % GDP, 2022-2070)
    countries: [FRA, DEU]
    lines: [GF07, GF09, GF10_components]
    horizon_year: 2070
    last_actual_year: 2022
    concept_note: AWG perimeter vs COFOG functions — coverage measured per line;
      nominal GDP constructed per §7.5 from AR potential-growth and HICP assumptions;
      DE country note — cash and in-kind LTC both public under current rules
    api:
      kind: xlsx_download
      landing: https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
      note: statistical annex xlsx served from the EC document store; browser-like
        headers required (anti-bot interstitial otherwise) — recorded in the pull
    verification:
      status: resolved_live
      checked: 2026-08-31
      last_update_observed: "2024-04-18"
      note: annual tables (not benchmark-only) verified in the snapshot; no 2027 AR
        published as of 2026-08-31 (3-yearly cycle -> next expected 2027; V11 watch)

  EC_DSM:
    institution: European Commission
    object: Debt Sustainability Monitor 2025, baseline country fiches (to 2036)
    countries: [FRA, DEU]
    lines: [GF01_7, envelope]
    horizon_year: 2036
    last_actual_year: 2024
    concept_note: GG, ESA; interest expenditure % of GDP (gross accrued D.41, EDP
      concept); nominal path via DSM real-growth and inflation assumptions (§7.5)
    api:
      kind: xlsx_download
      landing: https://economy-finance.ec.europa.eu/publications/debt-sustainability-monitor-2025_en
      note: country fiches tables xlsx from the EC document store (browser headers required)
    verification:
      status: resolved_live
      checked: 2026-08-31
      last_update_observed: "2026-02-12"
      note: DSM 2025 published 2026-02-12 confirmed as the latest edition live

  FRA_LPFP_PSTAB:
    institution: France (DG Trésor / Gouvernement)
    object: Loi de programmation / programme de stabilité, prélèvements obligatoires (4-5 yrs)
    countries: [FRA]
    lines: [R01, R02, R03, R04, R05, R06, envelope]
    concept_note: ESA-ish; CSG is D.5 -> R03 not R06 (§14); charge de la dette is central-only
    verification: {status: not_machine_readable, checked: 2026-08-31,
                   note: PDF-only publication; §11.4 second keying unavailable to a
                   single-agent session (OQ-5 precedent, OQ-6)}

  COR_2026:
    institution: COR
    object: COR annual report, pensions (long-term)
    countries: [FRA]
    lines: [GF10_pensions]
    verification: {status: not_machine_readable, checked: 2026-08-31,
                   note: "cor-retraites.fr reachable but the annual report is
                   PDF-only (§11.4 blocked, OQ-5/OQ-6); 2023 reform vs AR2024
                   assumptions — expect V16 divergence (§14)"}

  FRA_LPM_2030:
    institution: France
    object: Military programming law to 2030 (central budgetary)
    countries: [FRA]
    lines: [GF02]
    concept_note: Central; gendarmerie (GF03) excluded
    verification: {status: not_machine_readable, checked: 2026-08-31,
                   note: law text with annual credits table, no machine-readable
                   dataset (§11.4 blocked, OQ-6)}

  FRA_LFSS:
    institution: France
    object: LFSS projections (short-term)
    countries: [FRA]
    lines: [GF07, GF10, R06]
    verification: {status: not_machine_readable, checked: 2026-08-31,
                   note: annex PDFs only (§11.4 blocked, OQ-6)}

  DEU_STEUERSCHAETZUNG:
    institution: Arbeitskreis Steuerschätzungen (BMF)
    object: 170th session (May 2026) results, revenue by tax, all levels, to 2030
    countries: [DEU]
    lines: [R01, R03, R04]
    horizon_year: 2030
    last_actual_year: 2025
    concept_note: Cash Finanzstatistik, growth only (§7.11); Kindergeld/Zulagen
      netting differs from the anchor's gross accrued ESA treatment (D17);
      EU own resources are financing items outside the tax lines used;
      Soli payer-type split from the source's own Tab 8.2 (§14)
    api:
      kind: xlsx_download
      landing: https://www.bundesfinanzministerium.de/Content/DE/Standardartikel/Themen/Steuern/Steuerschaetzungen_und_Steuereinnahmen/Steuerschaetzung/2026-05-07-ergebnisse-170-sitzung-steuerschaetzung.html
    verification:
      status: resolved_live
      checked: 2026-08-31
      last_update_observed: "2026-05-07"
      note: xlsx edition of the Tabellen 1-8 results confirmed and snapshotted;
        next session (Oct/Nov 2026) supersedes — V11 watch

  DEU_BMAS_RVB:
    institution: BMAS / DRV
    object: Rentenversicherungsbericht (15 yrs, GRV only)
    countries: [DEU]
    lines: [GF10_grv, R06_grv]
    verification: {status: blocked, checked: 2026-08-31,
                   note: bmas.de CONNECT denied by the egress policy (OQ-6)}

  DEU_BMF_FINPLAN:
    institution: BMF
    object: Federal budget and financial plan to 2030 (federal only)
    countries: [DEU]
    lines: [GF02, federal_interest]
    concept_note: Epl. 14 + Sondervermoegen Bundeswehr; Epl. 32 interest is federal — AMECO/DSM preferred for GF01_7 (§14)
    verification: {status: not_machine_readable, checked: 2026-08-31,
                   note: Finanzplan is PDF-only (§11.4 blocked, OQ-6)}

# D7 — no identified forecast anywhere (declare, do not construct):
no_forecast_lines:
  expenditure: [GF03, GF04, GF05, GF06, GF08, GF01_X]
  revenue: [R08, R10]
  revenue_partial: {R05: other-taxes component partial, R06: imputed component}
