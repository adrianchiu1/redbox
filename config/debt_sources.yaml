    object: "gov_10a_main by subsector: D41PAY and B9 for S1311, S1312, S1313, S1314, S13 (FR, DE), 1995-"
    trees: [debt]
    countries: [FRA, DEU]
    role: reconciliation_intermediate
    api: {kind: sdmx, base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0, data_path: data/dataflow/ESTAT/gov_10a_main/1.0/, format: csvdata}
    verification: {status: confirmed_live, checked: 2026-09-09}
  EUROSTAT_GOV10DD:
    institution: Eurostat
    object: "gov_10dd_ggd (debt by instrument x holder x maturity, S1311/S13), gov_10dd_rmd (remaining maturity, GD_VAR, YR), gov_10dd_edpt1/2/3 (EDP incl. SFA), gov_10dd_dcur, gov_10q_ggdebt (quarterly incl. S13111), 1995-"
    trees: [debt]
    countries: [FRA, DEU]
    role: reconciliation_intermediate
    api: {kind: sdmx, base: https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0, format: csvdata}
    verification: {status: confirmed_live, checked: 2026-09-09, note: "UK absent from all Eurostat government-finance flows"}
  EUROSTAT_PRC_HICP:
