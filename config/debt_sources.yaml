    trees: [debt]
    countries: [GBR, FRA, DEU]
    role: reconciliation_intermediate
    api: {kind: sdmx, base: https://sdmx.oecd.org/public/rest, dataflow: "OECD.SDD.NAD,DSD_NASEC20@DF_T7PSD_Q,1.1"}
    verification: {status: confirmed_live, checked: 2026-09-09}
  OECD_FINMARK:
    institution: OECD
    object: "DSD_STES@DF_FINMARK: IR3TIB (FRA 1970-, DEU 1960-, GBR 1986-), IRLT (1956/1960-)"
    trees: [debt]
    countries: [GBR, FRA, DEU]
    role: reference_series
    api: {kind: sdmx, base: https://sdmx.oecd.org/public/rest, dataflow: "OECD.SDD.STES,DSD_STES@DF_FINMARK,4.0"}
    verification: {status: confirmed_live, checked: 2026-09-09}
  ECB_EMMI_RATES:
    institution: ECB / EMMI
    object: "€STR, Euribor fixings (contractual references for euro floaters)"
    trees: [debt]
    countries: [FRA, DEU]
    role: reference_series
    api: {kind: sdmx, base: https://data-api.ecb.europa.eu/service/data/FM/}
    verification: {status: blocked, checked: 2026-09-09}
  BDF_WEBSTAT:
    institution: Banque de France
    object: "Webstat SC1 État securities stock and net issuance (S1311 F.33); TEC10; daily bond indices"
    trees: [debt]
    countries: [FRA]
    role: reconciliation_intermediate
    api: {kind: html_download, landing: https://webstat.banque-france.fr/}
    verification: {status: blocked, checked: 2026-09-09}
  BBK_KAPITALMARKT:
    institution: Deutsche Bundesbank
    object: "Kapitalmarktstatistik (PDF per issue), Umlauf von Schuldverschreibungen (Nr. 03), Svensson curve, yields by residual maturity"
    trees: [debt]
    countries: [DEU]
