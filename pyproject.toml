[project]
name = "ggfiscal"
version = "0.0.1"
description = "gg-fiscal: long-horizon general-government expenditure by COFOG function, revenue by ESA type, and WEO reconciliation (GBR, FRA, DEU)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "pandera>=0.17",
    "typer>=0.9",
    "requests>=2.31",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pypdf>=4.0",       # debt extension: NLF accounts, Kreditaufnahmebericht annexes
    "cffi>=1.16",       # pypdf's cryptography backend needs it on this image
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Only needed to re-execute notebooks/derivation.ipynb; reading it needs nothing.
notebook = ["nbformat>=5.9", "nbclient>=0.9", "nbconvert>=7.0", "ipykernel>=6.25"]
# Only needed for `ggfiscal statistical-forecasts`; the published CSV it
# writes is read with pandas alone.
forecast = ["pmdarima>=2.0", "statsmodels>=0.14", "prophet>=1.1", "scipy>=1.11"]
# Only needed for `ggfiscal debt fetch`: several debt offices serve their
# files only to a real browser session (ggfiscal/debt/browser.py). Building
# and validating the debt tables from existing snapshots needs none of it.
debt = ["playwright>=1.40"]

[project.scripts]
ggfiscal = "ggfiscal.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
